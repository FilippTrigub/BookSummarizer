<!DOCTYPE html>
<html>
<head>
    <title>Book Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
    </style>
    <script>
        let chapterPhrases = Array(3).fill('');

        function addChapterPhraseField() {
            const container = document.getElementById('chapterPhrases');
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Chapter phrase';
            container.appendChild(input);
            chapterPhrases.push('');
        }

        function summarize() {
            const audioFile = document.getElementById('audioFile').files[0];
            if (!audioFile) {
                alert('Please upload an audio file');
                return;
            }

            const chapterPhraseInputs = document.getElementById('chapterPhrases').getElementsByTagName('input');
            for (let i = 0; i < chapterPhraseInputs.length; i++) {
                const phrase = chapterPhraseInputs[i].value;
                chapterPhrases[i] = phrase || chapterPhrases[0];
            }

            const emailAddress = document.getElementById('emailAddress').value;
            if (!emailAddress) {
                alert('Please provide your email address');
                return;
            }

            document.body.innerHTML = 'Great! The summary will be sent to your email address!';
            // Call the backend with the audio file and chapter phrases
            // This is just a placeholder, replace it with your actual backend call
            // callBackend(audioFile, chapterPhrases);
        }
    </script>
</head>
<body>
    <h1>Book Summarizer</h1>
    <input type="file" id="audioFile">
    <div id="chapterPhrases">
        <input type="text" placeholder="Chapter phrase">
        <input type="text" placeholder="Chapter phrase">
        <input type="text" placeholder="Chapter phrase">
    </div>
    <button onclick="addChapterPhraseField()">Add another chapter phrase field</button>
    <input type="text" id="emailAddress" placeholder="Email address">
    <button onclick="summarize()">Summarize</button>
</body>
</html>
