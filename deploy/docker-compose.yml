version: '3.8'

services:
  app:
    image: generalregistry.azurecr.io/audiosummarizer_api
    build:
      context: ../app
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8081:8081
    networks:
      - audio-summarizer-network

  ui:
    image: generalregistry.azurecr.io/audiosummarizer_ui
    build:
      context: ../UI
      dockerfile: Dockerfile
      args:
        - API_URI=localhost
    restart: always
    ports:
      - 80:80
    depends_on:
      - app
    networks:
      - audio-summarizer-network


networks:
  audio-summarizer-network: