version: '3.8'

services:
  api:
    image: generalregistry.azurecr.io/booksummarizer_api
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8081:8081
    networks:
      - book-summarizer-network

  ui:
    image: generalregistry.azurecr.io/booksummarizer_ui
    build:
      context: ../UI
      dockerfile: Dockerfile
      args:
        - API_URI=localhost
    restart: always
    ports:
      - 80:80
    depends_on:
      - api
    networks:
      - book-summarizer-network


networks:
  book-summarizer-network: